function SakariEliteProgram() {
  const [activeWeek, setActiveWeek] = useState(1);
  const [activeWorkout, setActiveWorkout] = useState('lowerA');
  const [activeTab, setActiveTab] = useState('workout'); // workout, mobility, nutrition, recovery, progression
  const [workoutData, setWorkoutData] = useState({});
  const [expandedExercise, setExpandedExercise] = useState(null);

  const weekData = WEEK_1_DATA; // For now showing Week 1, will scale to all 6 weeks

  const handleSetData = (week, workout, exerciseIndex, setIndex, field, value) => {
    setWorkoutData(prev => {
      const newData = { ...prev };
      const key = `w${week}-${workout}`;
      if (!newData[key]) newData[key] = {};
      if (!newData[key][exerciseIndex]) newData[key][exerciseIndex] = {};
      if (!newData[key][exerciseIndex][setIndex]) newData[key][exerciseIndex][setIndex] = {};
      newData[key][exerciseIndex][setIndex][field] = value;
      return newData;
    });
  };

  const parseSets = (setsStr) => {
    const match = setsStr.match(/(\d+)x(\d+)/);
    if (match) return parseInt(match[1]);
    return 3; // default
  };

  const getCurrentWorkoutData = () => {
    const workoutMap = {
      lowerA: weekData.lowerA,
      upperA: weekData.upperA,
      lowerB: weekData.lowerB,
      upperB: weekData.upperB
    };
    return workoutMap[activeWorkout];
  };

  const currentWorkout = getCurrentWorkoutData();

  const renderExerciseCard = (exercise, index, section) => {
    const numSets = parseSets(exercise.sets);
    const key = `w${activeWeek}-${activeWorkout}`;
    const isExpanded = expandedExercise === `${section}-${index}`;

    return (
      <div key={index} className="bg-gradient-to-br from-gray-800 to-gray-900 border-2 border-gray-700 rounded-xl p-3 sm:p-4 md:p-5 hover:border-yellow-500 transition-all">
        <div className="flex flex-col sm:flex-row justify-between items-start gap-3 sm:gap-4 mb-3">
          <div className="flex-1 w-full">
            <a
              href={exercise.link}
              target="_blank"
              rel="noopener noreferrer"
              className="font-bebas text-lg sm:text-xl md:text-2xl text-yellow-500 hover:text-yellow-400 transition-colors flex items-center gap-2 touch-manipulation"
            >
              <span className="text-xl sm:text-2xl">🎥</span>
              <span className="break-words">{exercise.name}</span>
            </a>
            {exercise.note && (
              <p className="text-gray-400 text-xs sm:text-sm mt-1 break-words">💡 {exercise.note}</p>
            )}
          </div>
          <div className="flex sm:flex-col items-center sm:items-end gap-2 self-start">
            <span className="font-bebas text-base sm:text-lg bg-yellow-500/20 border border-yellow-500 px-2 sm:px-3 py-1 rounded whitespace-nowrap">
              {exercise.sets}
            </span>
            {exercise.tempo && (
              <span className="text-xs text-blue-400 bg-blue-900/20 px-2 py-1 rounded whitespace-nowrap">
                {exercise.tempo}
              </span>
            )}
          </div>
        </div>

        <button
          onClick={() => setExpandedExercise(isExpanded ? null : `${section}-${index}`)}
          className="text-xs sm:text-sm text-gray-400 hover:text-yellow-500 active:text-yellow-400 transition-colors mb-3 py-2 px-3 bg-gray-900/50 rounded touch-manipulation w-full sm:w-auto"
        >
          {isExpanded ? '▼ Hide tracking' : '▶ Track sets'}
        </button>

        {isExpanded && (
          <div className="space-y-2 sm:space-y-3 pt-3 border-t border-gray-700">
            {[...Array(numSets)].map((_, setIndex) => {
              const savedData = workoutData[key]?.[index]?.[setIndex] || {};
              return (
                <div key={setIndex} className="flex flex-col sm:flex-row items-start sm:items-center gap-2 sm:gap-3 p-3 bg-black/30 rounded-lg border border-gray-700">
                  <span className="font-bebas text-yellow-500 text-base sm:text-lg min-w-[60px]">Set {setIndex + 1}</span>
                  <div className="flex-1 w-full grid grid-cols-2 gap-2 sm:gap-3">
                    <div>
                      <label className="block text-xs text-gray-400 uppercase mb-1">Weight</label>
                      <input
                        type="text"
                        placeholder="100kg"
                        value={savedData.weight || ''}
                        onChange={(e) => handleSetData(activeWeek, activeWorkout, index, setIndex, 'weight', e.target.value)}
                        className="w-full bg-gray-900 border border-gray-600 rounded px-3 py-3 text-white text-sm sm:text-base focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50 touch-manipulation"
                        inputMode="decimal"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-gray-400 uppercase mb-1">RPE</label>
                      <input
                        type="number"
                        placeholder="8"
                        min="1"
                        max="10"
                        value={savedData.rpe || ''}
                        onChange={(e) => handleSetData(activeWeek, activeWorkout, index, setIndex, 'rpe', e.target.value)}
                        className="w-full bg-gray-900 border border-gray-600 rounded px-3 py-3 text-white text-sm sm:text-base focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/50 touch-manipulation"
                        inputMode="numeric"
                      />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  return (

                  <ul className="space-y-2 text-gray-300">
                    {RECOVERY_PROTOCOL.stressManagement.additional.map((item, i) => (
                      <li key={i} className="flex items-start gap-2">
                        <span className="text-orange-400">•</span>
                        <span>{item}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>
            </div>
          </div>
        )}

        {activeTab === 'progression' && (
          <div className="space-y-4 sm:space-y-6">
            <div className="bg-gradient-to-br from-red-600 to-red-700 rounded-xl p-4 sm:p-6 shadow-2xl">
              <h2 className="font-bebas text-2xl sm:text-3xl md:text-4xl text-white mb-2">📈 Progressive Overload Strategy</h2>
              <p className="text-white text-sm sm:text-base md:text-lg">How to get stronger across 6 weeks</p>
            </div>

            {/* Principles */}
            <div className="bg-gradient-to-br from-gray-800 to-gray-900 border-2 border-yellow-500 rounded-xl p-6">
              <h3 className="font-bebas text-3xl text-yellow-400 mb-4">{PROGRESSION_GUIDELINES.title}</h3>
              <ul className="space-y-3">
                {PROGRESSION_GUIDELINES.principles.map((principle, i) => (
                  <li key={i} className="flex items-start gap-3 text-gray-300 text-lg">
                    <span className="text-yellow-400 mt-1">⚡</span>
                    <span>{principle}</span>
                  </li>
                ))}
              </ul>
            </div>

            {/* Main Lift Progression */}
            <div className="bg-gradient-to-br from-gray-800 to-gray-900 border-2 border-red-500 rounded-xl p-6">
              <h3 className="font-bebas text-3xl text-red-400 mb-4">{PROGRESSION_GUIDELINES.mainLifts.title}</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr className="border-b-2 border-red-500">
                      <th className="font-bebas text-yellow-500 p-3">Week</th>
                      <th className="font-bebas text-yellow-500 p-3">Intensity</th>
                      <th className="font-bebas text-yellow-500 p-3">Sets × Reps</th>
                      <th className="font-bebas text-yellow-500 p-3">Focus</th>
                    </tr>
                  </thead>
                  <tbody>
                    {PROGRESSION_GUIDELINES.mainLifts.weeks.map((week, i) => (
                      <tr key={i} className="border-b border-gray-700 hover:bg-gray-800/50">
                        <td className="p-3 font-bold text-white">{week.week}</td>
                        <td className="p-3 text-gray-300">{week.intensity}</td>
                        <td className="p-3 text-gray-300">{week.sets}</td>
                        <td className="p-3 text-gray-400 text-sm">{week.note}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Accessory Progression */}
            <div className="bg-gradient-to-br from-gray-800 to-gray-900 border-2 border-blue-500 rounded-xl p-6">
              <h3 className="font-bebas text-3xl text-blue-400 mb-4">{PROGRESSION_GUIDELINES.accessories.title}</h3>
              <p className="text-gray-300 text-lg">{PROGRESSION_GUIDELINES.accessories.strategy}</p>
              <div className="mt-4 bg-blue-900/20 border-l-4 border-blue-500 p-4 rounded">
                <p className="text-blue-200"><strong>Example:</strong> If you complete 2×12 reps with good form, add weight next week and drop back to 2×8.</p>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SakariEliteProgram />);
  </script>
</body>
</html>
