<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Sakari Siltakorpi Elite Offseason Training Program - VLV 6-Week Strength & Power Block">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Sakari Siltakorpi - Elite Offseason Program | VLV</title>

  <!-- Preload critical fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React and ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Base styles for mobile optimization */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
      width: 100%;
    }

    /* Prevent text size adjustment on mobile */
    html {
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Loading indicator */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      color: #F5C842;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">Loading VLV Elite Program...</div>
  </div>

  <!-- Inline React component to avoid module export issues -->
  <script type="text/babel">
    const { useState } = React;

    // Import the component code by fetching and evaluating it
    fetch('sakari-elite-program.jsx')
      .then(response => response.text())
      .then(code => {
        // Remove the import statement and export statement
        code = code.replace(/import.*from.*['"];?/g, '');
        code = code.replace(/export default function/, 'function');

        // Create a function that returns the component
        const componentCode = code + '\n\nreturn SakariEliteProgram;';
        const SakariEliteProgram = new Function('React', 'useState', componentCode)(React, useState);

        // Render the component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(SakariEliteProgram));
      })
      .catch(error => {
        console.error('Error loading component:', error);
        document.getElementById('root').innerHTML = `
          <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; color: #F5C842; font-size: 1.5rem; padding: 20px; text-align: center;">
            <div>
              <div style="margin-bottom: 20px;">⚠️ Error Loading App</div>
              <div style="font-size: 1rem; color: #ccc;">${error.message}</div>
              <div style="font-size: 0.9rem; color: #888; margin-top: 10px;">
                Please make sure you're running this from a web server, not directly from the file system.
              </div>
            </div>
          </div>
        `;
      });
  </script>
</body>
</html>
